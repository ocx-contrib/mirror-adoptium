# ocx-baseline: template-owned file — change ocx-sh/conventions, then run task copier:update
name: Report
description: Report a problem
assignees: ["michael-herwig"]
body:
  - type: input
    id: package
    attributes:
      label: Package
      description: The ocx.sh package, e.g. ocx.sh/age/age
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The package version affected
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - linux/amd64
        - linux/arm64
        - darwin/amd64
        - darwin/arm64
        - windows/amd64
        - windows/arm64
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got
    validations:
      required: true
