# ocx-baseline: template-owned file — change ocx-sh/conventions, then run task copier:update
name: verify-basic

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-basic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # `task secrets` (gitleaks git) scans the full history
      - uses: ocx-sh/conventions/.github/actions/setup@974cc5d9aeeae05097291d2a0d0c56ff9c614ef8 # v0.2.5
        with:
          groups: default,lint
      - run: task ci:lint
      - run: task lock:check
      - run: task baseline:check
      - run: task secrets
      - run: |
          # actionlint + zizmor, both pinned in taskfiles/baseline.taskfile.yml
          task workflows:lint

  # The single required check: every job succeeded (or was skipped).
  basic-gate:
    if: always()
    needs: [lint]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require success or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" > /dev/null
